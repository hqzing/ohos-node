name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ossutil + aliyun CLI
        run: |
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
          cd /tmp && unzip -q ossutil.zip
          sudo install -m755 /tmp/ossutil-2.1.2-linux-amd64/ossutil /usr/local/bin/ossutil
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz | sudo tar -xz -C /usr/local/bin aliyun

      - name: Generate dist tree
        run: python3 tools/deploy-nodejs-dist.py .dist-out

      - name: Deploy to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: |
          region=$(echo "$OSS_ENDPOINT" | sed 's/^https\?:\/\///;s/^oss-//;s/\..*//')
          ossutil sync .dist-out/ oss://ohos-node/dist/ --delete -f \
            -e "$OSS_ENDPOINT" -i "$OSS_AK" -k "$OSS_SK" --region "$region"
          for f in index.html favicon.ico favicon.svg; do
            ossutil cp -f "dist-page/$f" "oss://ohos-node/$f" \
              -e "$OSS_ENDPOINT" -i "$OSS_AK" -k "$OSS_SK" --region "$region"
          done

      - name: Refresh CDN cache
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_AK: ${{ secrets.OSS_AK }}
          OSS_SK: ${{ secrets.OSS_SK }}
        run: |
          region=$(echo "$OSS_ENDPOINT" | sed 's/oss-//;s/\..*//')
          aliyun cdn RefreshObjectCaches --region "$region" \
            --access-key-id "$OSS_AK" --access-key-secret "$OSS_SK" \
            --ObjectPath "https://ohos-node.com/" --ObjectType Directory
